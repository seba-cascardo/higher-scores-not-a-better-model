[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msap"
version = "0.1.0"
description = "RoMuLo (Routed Multi-LoFiT): routed-modular adapters for LLM specialization"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",   # pod uses 5.8; floor kept for local compat
    "datasets>=2.20",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "peft>=0.11",           # LoRA adapters (train_router_lora, train_v2x, route_two_pass, eval_multi_lofit_e2e)
    "joblib>=1.3",          # probe parallelism (bench_probe_parallelism, probe_taxonomy_per_class)
    "scikit-learn>=1.4",    # logistic regression probes + activation routers
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.5"]
eval = ["lm-eval>=0.4"]     # held-out evaluation harness (run_lm_eval_v7, run_lm_eval_v7_routed)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA GPU", "slow: slow test"]
