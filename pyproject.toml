[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msap"
version = "0.1.0"
description = "MSAP-Sleep: geometric reorganization post-training"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA GPU", "slow: slow test"]
